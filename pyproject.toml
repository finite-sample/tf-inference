[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tf-inference"
version = "0.1.0"
description = "Numerically constructed tF critical values for single-instrument IV inference"
readme = "README.rst"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Gaurav Sood"}]
keywords = ["instrumental variables", "weak instruments", "econometrics", "inference", "tF"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Science/Research", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Mathematics"]
dependencies = ["numpy>=1.26", "scipy>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "black", "isort", "flake8", "ruff", "build", "setuptools>=77", "wheel", "sphinx>=7"]

[project.scripts]
tf-inference = "tf_inference.cli:main"

[project.urls]
Homepage = "https://github.com/finite-sample/tf-inference"
Repository = "https://github.com/finite-sample/tf-inference"
Issues = "https://github.com/finite-sample/tf-inference/issues"
Documentation = "https://github.com/finite-sample/tf-inference#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tf_inference = ["data/*.npz", "data/*.json", "data/*.csv.gz", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
